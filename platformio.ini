; RML 2.0 BAScloud - Ferraris-Zaehler-Ausleser (ESP32, Arduino)
;
; Arduino-Port von ferraris-pio (ESP-IDF). Plattform pioarduino 61.04.00-RC1
; = Arduino-ESP32 4.0.0-RC1 auf ESP-IDF 6.1 -> die IDF-Treiber (adc_continuous,
; adc_oneshot, esp-mqtt) stehen unveraendert zur Verfuegung.
;
;   pio run                         bauen
;   pio run -t upload               flashen (Devkit, Auto-Reset per DTR/RTS)
;   pio device monitor              Konsole 115200
;   pio test -e native              Unit-Tests der pure-C-Logik auf dem PC
;
; Funktions-Schalter und Pins: include/ferraris_config.h (ersetzt Kconfig),
; WLAN-/MQTT-Zugangsdaten: include/secrets.h (Vorlage secrets.example.h).

[platformio]
default_envs = esp32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip

[esp32_common]
framework = arduino
board = esp32dev
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
; je OTA-Slot 0x1E0000 (siehe partitions_ferraris.csv)
board_upload.maximum_size = 1966080
board_build.partitions = partitions_ferraris.csv
upload_speed = 460800
monitor_speed = 115200
; Kein monitor_filters = esp32_exception_decoder: pioarduino 61.x liefert den
; CLI-Filter nicht mehr (Ersatz: VS-Code-Extension "ESP Decoder", Jason2866).
build_flags =
    -DCORE_DEBUG_LEVEL=1
; boot_app0.bin (leeres otadata -> startet app0) an unser otadata statt an
; den Arduino-Default 0xe000 (dort liegt bei uns die letzte NVS-Seite).
board_upload.arduino.boot_app0 = 0x10000
; Bewusst kein lib_deps: WiFi, WebServer, ESPmDNS und esp-mqtt kommen mit dem Core.

; Ein USB-Seriell-Adapter (Board), Auto-Reset per DTR/RTS, Port wird automatisch erkannt.
[env:esp32]
extends = esp32_common

; Unit-Tests der pure-C-Logik (Quadratur, Schmitt, Auto-Tune, Logger, Leistung,
; HW-Klassifikation) auf dem PC. ESP-only-Bibliotheken werden ignoriert.
[env:native]
platform = native
test_build_src = no
lib_ignore =
    adc_sampler
    ferraris_logger
    ferraris_hwdetect
    ferraris_net
    ferraris_settings_store
    ferraris_sysmon
build_flags =
    -Wall
    -Wextra
